version: 2
updates:
  - package-ecosystem: bun
    directory: /backend
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
  - package-ecosystem: bun
    directory: /frontend
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
