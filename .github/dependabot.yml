version: 2
updates:
  - package-ecosystem: bun
    directory: /backend
    schedule: {interval: monthly}
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: bun
    directory: /frontend
    schedule: {interval: monthly}
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
