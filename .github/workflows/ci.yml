name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diecast_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Only the test DB exists in CI. DATABASE_URL is required by env.ts but is
      # never connected to here: `bun test` swaps it for DATABASE_URL_TEST (BL-006).
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/diecast
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/diecast_test
      ACCESS_TOKEN_SECRET: ci-access-token-secret-0123456789abcdef
      REFRESH_TOKEN_SECRET: ci-refresh-token-secret-0123456789abcdef
      APP_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - name: Test DB schema + seed (db:reset --no-fixtures)
        # Wipes and rebuilds the CI test DB: schema, roles, permissions, approval policies, admin.
        # The target is DATABASE_URL as given here (the test DB); tests then run on DATABASE_URL_TEST.
        run: bun run db:reset --no-fixtures
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/diecast_test
          SEED_USER_PASSWORD: ci-seed-password-1
      - name: Migrations are in sync with the schema
        # BR-MIG-12: generate must find nothing to write; a schema change without its migration
        # leaves a new or changed file under src/db/migrations and fails here.
        run: |
          bun run drizzle-kit generate
          bun run drizzle-kit check
          if [ -n "$(git status --porcelain -- src/db/migrations)" ]; then
            echo "Schema changed without a migration. Run 'bun run db:generate' and commit:"
            git status --porcelain -- src/db/migrations
            exit 1
          fi
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/diecast_test
      - run: bun test
      - name: Contract manifest is committed and current
        run: bun run contract:check
      - name: Standards check (blocking, BR-STD-29)
        if: ${{ !cancelled() }}
        run: bun run standards:check:strict
      - name: Dependency audit (non-blocking)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: bun audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run lint
      - name: Unit tests (design system, BR-DS-*)
        run: bun run test
      - name: Contrast check (BR-DS-02)
        run: bun run contrast:check
      - run: bun run build
      - name: Standards check (blocking for mutation-invalidate and motion, BR-STD-30)
        # raw-palette stays report-only until issue #91.
        if: ${{ !cancelled() }}
        run: bun run standards:check -- --strict=mutation-invalidate,motion
      - name: Dependency audit (non-blocking)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: bun audit

  e2e:
    # UI end-to-end tests (Playwright, frontend/e2e). Non-blocking for now.
    # Every step after "Find specs" is skipped while frontend/e2e has no *.spec.ts, so the job is green.
    # Runs only on PRs into main and pushes to main: sub-feature PRs into epic/* run it locally instead
    # (test-runner step 9, .claude/agents/test-runner.md), which saves a 5-minute CI round trip per push.
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diecast_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Only the throw-away test DB exists in CI; the API under test runs on it.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/diecast_test
      ACCESS_TOKEN_SECRET: ci-access-token-secret-0123456789abcdef
      REFRESH_TOKEN_SECRET: ci-refresh-token-secret-0123456789abcdef
      APP_ORIGIN: http://localhost:3000
      PORT: 4000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      SEED_USER_PASSWORD: ci-seed-password-1
    steps:
      - uses: actions/checkout@v7
      - name: Find specs
        id: specs
        run: |
          if find frontend/e2e -name '*.spec.ts' 2>/dev/null | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No *.spec.ts in frontend/e2e yet: e2e skipped."
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.specs.outputs.found == 'true'
      - name: Backend - install, demo data (db:reset with fixtures), start API
        if: steps.specs.outputs.found == 'true'
        working-directory: backend
        run: |
          bun install --frozen-lockfile
          bun run db:reset
          nohup bun src/index.ts > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:4000/health > /dev/null && exit 0; sleep 1; done
          cat ../api.log; exit 1
      - name: Frontend - install, Chromium, run Playwright
        if: steps.specs.outputs.found == 'true'
        working-directory: frontend
        env:
          PORT: 3000
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          bun run e2e
      - name: Keep screenshots and report
        if: ${{ !cancelled() && steps.specs.outputs.found == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  secret-scan:
    # gitleaks over the full history of the pushed range. Non-blocking for the first run.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commit-separation:
    # Test independence: no commit in the PR touches both tests and non-test source.
    # Report mode for now; add `--strict` to make it blocking.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tests and source are in separate commits (report mode)
        run: >-
          bash .github/scripts/check-commit-separation.sh
          "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
