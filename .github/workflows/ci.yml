name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diecast_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Only the test DB exists in CI. DATABASE_URL is required by env.ts but is
      # never connected to here: `bun test` swaps it for DATABASE_URL_TEST (BL-006).
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/diecast
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/diecast_test
      ACCESS_TOKEN_SECRET: ci-access-token-secret-0123456789abcdef
      REFRESH_TOKEN_SECRET: ci-refresh-token-secret-0123456789abcdef
      APP_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - name: Test DB schema + seed (db:reset --no-fixtures)
        # Wipes and rebuilds the CI test DB: schema, roles, permissions, approval policies, admin.
        # The target is DATABASE_URL as given here (the test DB); tests then run on DATABASE_URL_TEST.
        run: bun run db:reset --no-fixtures
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/diecast_test
          SEED_USER_PASSWORD: ci-seed-password-1
      - run: bun test
      - name: Contract manifest is committed and current
        run: bun run contract:check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run lint
